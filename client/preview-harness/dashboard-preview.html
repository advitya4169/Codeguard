<!doctype html>

    <title>CodeGuard Dashboard Preview</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #090e1b; }

      #preview-notice strong { color: #c4b5fd; letter-spacing: .08em; }
      #preview-request-status { color: #a5b4fc; font-weight: 400; }
      #preview-root { min-height: calc(100vh - 35px); }

  <body>
    <aside id="preview-notice" role="status">
